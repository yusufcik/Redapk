name: Build REDgram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Disk joyini bo'shatish
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Kodni yuklab olish (submodule bilan)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Qurilish vositalari
        run: sudo apt-get update && sudo apt-get install -y yasm nasm ninja-build cmake golang-go perl

      - name: NDK o'rnatish
        run: |
          NDK_VERSION=$(grep -rhoE 'ndkVersion[ =]+"[^"]+"' --include=build.gradle . | head -1 | grep -oE '[0-9]+(\.[0-9]+)+' || true)
          NDK_VERSION=${NDK_VERSION:-27.2.12479018}
          echo "NDK versiyasi: $NDK_VER
