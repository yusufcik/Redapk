                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          request(false);
                          if (done != null) {
                              AndroidUtilities.runOnUIThread(done);
                          }
                      }
                  }, "red-stats").start();
              }

              private static void request(boolean ping) {
                  HttpURLConnection c = null;
                  try {
                      String base = SERVER.endsWith("/") ? SERVER.substring(0, SERVER.length() - 1) : SERVER;
                      URL u = new URL(base + (ping ? "/api/red/ping" : "/api/red/stats"));
                      c = (HttpURLConnection) u.openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      if (ping) {
                          c.setRequestMethod("POST");
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type", "application/json");
                          byte[] body = ("{\"id\":\"" + installId() + "\"}").getBytes(StandardCharsets.UTF_8);
                          OutputStream os = c.getOutputStream();
                          os.write(body);
                          os.close();
                      }
                      if (c.getResponseCode() != 200) {
                          return;
                      }
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) {
                          sb.append(line);
                      }
                      r.close();
                      JSONObject j = new JSONObject(sb.toString());
                      statUsers = j.optInt("users", -1);
                      statOnline = j.optInt("online", -1);
                      statLatest = j.optString("latest", "");
                      statUrl = j.optString("url", "");
                      statAnnounce = j.optString("announce", "");
                  } catch (Throwable ignore) {
                  } finally {
                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              // ------------------------------------------------------------ mavzu (havorang -> qizil)
              private static final java.util.concurrent.ConcurrentHashMap<Integer, Integer> tintCache =
                      new java.util.concurrent.ConcurrentHashMap<>();

              public static int tint(int c) {
                  try {
                      Integer cached = tintCache.get(c);
                      if (cached != null) {
                          return cached;
                      }
                      int r = (c >> 16) & 0xff, g = (c >> 8) & 0xff, b = c & 0xff;
                      int max = Math.max(r, Math.max(g, b)), min = Math.min(r, Math.min(g, b));
                      int out = c;
                      if (max - min >= 40) {
                          float[] hsv = new float[3];
                          android.graphics.Color.colorToHSV(c, hsv);
                          if (hsv[0] >= 170f && hsv[0] <= 265f && hsv[1] >= 0.25f) {
                              hsv[0] = 356f;
                              out = android.graphics.Color.HSVToColor((c >>> 24) & 0xff, hsv);
                          }
                      }
                      if (tintCache.size() < 4096) {
                          tintCache.put(c, out);
                      }
                      return out;
                  } catch (Throwable e) {
                      return c;
                  }
              }

              // ------------------------------------------------------------ xatolik jurnali (sinov bosqichi uchun)
              public static void installCrashLog(final Context app) {
                  try {
                      final java.io.File f = new java.io.File(app.getFilesDir(), "redgram_crash.txt");
                      try {
                          if (f.exists()) {
                              StringBuilder sb = new StringBuilder();
                              java.io.BufferedReader r = new java.io.BufferedReader(new java.io.FileReader(f));
                              String line;
                              while ((line = r.readLine()) != null && sb.length() < 6000) {
