
name: Build REDgram AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Telegram source
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          submodules: recursive

      - name: Checkout REDgram files
        uses: actions/checkout@v4
        with:
          repository: yusufcik/Redapk
          ref: main
          path: redgram

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;21.4.7075529"
          sdkmanager "cmake;3.10.2.4988404"

      - name: Set Telegram API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "TG_API_ID yoki TG_API_HASH GitHub Secrets'da yo'q"
            exit 1
          fi

          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          sed -i "s/BuildVars.TELEGRAM_API_ID_PLACEHOLDER/$TG_API_ID/g" "$FILE" || true
          sed -i "s/BuildVars.TELEGRAM_API_HASH_PLACEHOLDER/$TG_API_HASH/g" "$FILE" || true

      - name: Change app name to REDgram
        run: |
          find . -path "*/src/main/res/values/strings.xml" -print0 |
          xargs -0 sed -i 's/>Telegram</>REDgram</g'

          FILE="TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java"
          if [ -f "$FILE" ]; then
            sed -i 's/new SpannableStringBuilder(getString(R.string.AppName))/new SpannableStringBuilder("REDgram")/' "$FILE"
          fi

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build AAB
        run: |
          ./gradlew :TMessagesProj_App:bundleAfatRelease \
            --stacktrace \
            --no-daemon

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore GitHub Secrets sozlanmagan."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > redgram-upload.jks

          AAB=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB fayl topilmadi"
            exit 1
          fi

          jarsigner \
            -keystore redgram-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

          mkdir -p output
          cp "$AAB" output/REDgram.aab

      - name: Upload REDgram AAB
        uses: actions/upload-artifact@v4
        with:
          name: REDgram-AAB
          path: output/REDgram.aab
          if-no-files-found: error
          
