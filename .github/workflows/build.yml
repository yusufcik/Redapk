                              r.close();
                              android.content.ClipboardManager cm =
                                      (android.content.ClipboardManager) app.getSystemService(Context.CLIPBOARD_SERVICE);
                              cm.setPrimaryClip(android.content.ClipData.newPlainText("REDgram xatolik", sb.toString()));
                              f.delete();
                              android.widget.Toast.makeText(app, "REDgram: oldingi xatolik matni nusxalandi",
                                      android.widget.Toast.LENGTH_LONG).show();
                          }
                      } catch (Throwable ignore) {
                      }
                      final Thread.UncaughtExceptionHandler prev = Thread.getDefaultUncaughtExceptionHandler();
                      Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                          @Override
                          public void uncaughtException(Thread t, Throwable e) {
                              try {
                                  String s = android.util.Log.getStackTraceString(e);
                                  if (s.length() > 6000) {
                                      s = s.substring(0, 6000);
                                  }
                                  java.io.FileWriter w = new java.io.FileWriter(f);
                                  w.write(s);
                                  w.close();
                              } catch (Throwable ignore) {
                              }
                              if (prev != null) {
                                  prev.uncaughtException(t, e);
                              }
                          }
                      });
                  } catch (Throwable ignore) {
                  }
              }
          }
