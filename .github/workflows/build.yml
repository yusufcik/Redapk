          def step(name):
              def deco(fn):
                  try:
                      msg = fn()
                      RESULTS.append((name, "OK", msg or ""))
                  except Exception as e:  # noqa: BLE001
                      RESULTS.append((name, "OGOHLANTIRISH", f"{type(e).__name__}: {e}"))
                  return fn
              return deco


          def read(path):
              with open(path, encoding="utf-8") as f:
                  return f.read()


          def write(path, text):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)


          # ------------------------------------------------------------------ 0. asl (o'zgartirilmagan) manba nusxalari - keyingi bosqich uchun manba nusxalari
          @step("Manba fayllar nusxasi (recon)")
          def recon():
              os.makedirs("recon", exist_ok=True)
              keep = ["org/telegram/ui/SettingsActivity.java", "org/telegram/ui/DialogsActivity.java",
                      "org/telegram/ui/ActionBar/Theme.java", "org/telegram/messenger/MessagesController.java",
                      "org/telegram/messenger/MessagesStorage.java", "org/telegram/ui/Cells/ChatMessageCell.java",
                      "org/telegram/messenger/LocaleController.java"]
              for rel in keep:
                  s = f"{JAVA_ROOT}/{rel}"
                  if os.path.exists(s):
                      shutil.copy(s, "recon/" + os.path.basename(rel))
              for p in glob.glob("**/src/main/res/values/styles.xml", recursive=True)[:1]:
                  shutil.copy(p, "recon/styles.xml")
              with open("recon/files.txt", "w") as f:
                  for p in sorted(glob.glob("**/res/**/*launcher*", recursive=True)):
                      f.write(p + "\n")
              pats = ["TL_account_updateStatus", "TL_updateDeleteMessages", "TL_updateEditMessage",
                      "TL_updateEditChannelMessage", "TL_updateDeleteChannelMessages", "applicationIdSuffix"]
              with open("recon/grep.txt", "w") as f:
                  for pat in pats:
                      out = subprocess.run(["grep", "-rn", "--include=*.java", "--include=*.gradle", pat, "."],
                                           capture_output=True, text=True).stdout.splitlines()[:40]
                      f.write(f"\n##### {pat}\n" + "\n".join(out) + "\n")
              sha = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
              write("recon/commit.txt", sha + "\n")
              return f"Telegram commit: {sha[:10]}"


          # ------------------------------------------------------------------ 1. nom
          @step("Ilova nomi (REDgram)")
          def app_name():
              # a) strings.xml
              for p in glob.glob("**/src/main/res/values/strings.xml", recursive=True):
                  t = read(p)
                  n = t.replace(">Telegram<", ">REDgram<")
                  if n != t:
                      write(p, n)
              # b) Java: serverdan keladigan tarjima o'rniga to'g'ridan-to'g'ri "REDgram"
              pat = re.compile(
                  r'(?:LocaleController\.)?getString\(\s*(?:"AppName"\s*,\s*)?R\.string\.AppName\s*\)')
              total = 0
              for p in glob.glob(f"{JAVA_ROOT}/**/*.java", recursive=True):
                  t = read(p)
                  n, c = pat.subn('"REDgram"', t)
                  if c:
                      write(p, n)
                      total += c
              if total == 0:
                  raise RuntimeError("AppName ishlatilgan joy topilmadi (recon ga qarang)")
              return f"{total} joyda almashtirildi"


          # ------------------------------------------------------------------ 2. ikonka
          @step("Ilova ikonkasi")
          def icons():
              from PIL import Image, ImageDraw
              src = Image.open(io.BytesIO(base64.b64decode(ICON_B64))).convert("RGB")
              bg = (15, 18, 23)

              def fit(size, round_mask=False):
                  im = src.resize((size, size), Image.LANCZOS).convert("RGBA")
                  if round_mask:
                      m = Image.new("L", (size * 4, size * 4), 0)
                      ImageDraw.Draw(m).ellipse([0, 0, size * 4 - 1, size * 4 - 1], fill=255)
                      im.putalpha(m.resize((size, size), Image.LANCZOS))
                  return im

              changed = 0
              for p in glob.glob("**/res/mipmap-*/ic_launcher*", recursive=True):
                  if "anydpi" in p or not p.lower().endswith((".png", ".webp")):
                      continue
                  try:
                      size = Image.open(p).size[0]
                  except Exception:  # noqa: BLE001
                      continue
                  im = fit(size, "round" in os.path.basename(p))
                  fmt = "WEBP" if p.lower().endswith(".webp") else "PNG"
                  im.save(p, fmt)
                  changed += 1

              # adaptive ikonka (Android 8+): fon rangi + o'rtaga joylangan rasm
              res = f"{RES_ROOT}"
              os.makedirs(f"{res}/drawable-nodpi", exist_ok=True)
              canvas = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              sz = int(432 * 0.74)
              inner = src.resize((sz, sz), Image.LANCZOS).convert("RGBA")
              off = (432 - inner.size[0]) // 2
              canvas.alpha_composite(inner, (off, off))
              canvas.save(f"{res}/drawable-nodpi/redgram_icon_fg.png")
              os.makedirs(f"{res}/values", exist_ok=True)
              write(f"{res}/values/redgram_colors.xml",
                    '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                    f'    <color name="redgram_icon_bg">#{bg[0]:02X}{bg[1]:02X}{bg[2]:02X}</color>\n</resources>\n')
              adaptive = ('<?xml version="1.0" encoding="utf-8"?>\n'
                          '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                          '    <background android:drawable="@color/redgram_icon_bg"/>\n'
                          '    <foreground android:drawable="@drawable/redgram_icon_fg"/>\n'
                          '</adaptive-icon>\n')
              xml_n = 0
              for p in glob.glob("**/res/mipmap-anydpi*/ic_launcher*.xml", recursive=True):
                  write(p, adaptive)
                  xml_n += 1
              if changed == 0 and xml_n == 0:
                  raise RuntimeError("ic_launcher fayllari topilmadi (recon/files.txt ga qarang)")
              return f"{changed} ta rasm, {xml_n} ta adaptive xml"


          # ------------------------------------------------------------------ 3. kirish ekrani
          @step("Kirish ekrani (Xush Kelibsiz)")
          def splash():
              os.makedirs(f"{RES_ROOT}/drawable-nodpi", exist_ok=True)
              from PIL import Image, ImageDraw, ImageFont
              S = 960
              sp = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(sp)
              def font(sz):
                  try:
                      return ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", sz)
                  except Exception:  # noqa: BLE001
                      return ImageFont.load_default(size=sz)
              size = 150
              while size > 20 and d.textlength("Kelibsiz", font=font(size)) > 470:
                  size -= 4
              f = font(size)
              lh = size * 1.15
              y0 = S / 2 - lh
              for i, line in enumerate(("Xush", "Kelibsiz")):
                  w = d.textlength(line, font=f)
                  d.text(((S - w) / 2, y0 + i * lh), line, font=f, fill=(220, 38, 38, 255))
              sp.save(f"{RES_ROOT}/drawable-nodpi/redgram_splash.png")
              hit = 0
              for p in glob.glob("**/src/main/res/values*/styles.xml", recursive=True):
                  t = read(p)
                  m = re.search(r'(<style\s+name="Theme\.TMessages\.Start"[^>]*>)', t)
                  if m and "windowSplashScreenAnimatedIcon" not in t:
                      add = ('\n        <item name="android:windowSplashScreenAnimatedIcon">@drawable/redgram_splash</item>'
                             '\n        <item name="android:windowSplashScreenBackground">#FFFFFF</item>')
                      write(p, t[:m.end()] + add + t[m.end():])
                      hit += 1
              if hit == 0:
                  raise RuntimeError("Theme.TMessages.Start topilmadi (recon/styles ga qarang)")
              return f"{hit} ta styles.xml o'zgardi"


          # ------------------------------------------------------------------ 4. qizil mavzu
          HOOK = '''
              // ---- REDgram: havorang tuslarni qizilga o'tkazish ----
              private static final java.util.concurrent.ConcurrentHashMap<Integer, Integer> redgramCache = new java.util.concurrent.ConcurrentHashMap<>();

              private static int redgramTint(int c) {
                  Integer cached = redgramCache.get(c);
                  if (cached != null) {
                      return cached;
                  }
                  int r = (c >> 16) & 0xff, g = (c >> 8) & 0xff, b = c & 0xff;
                  int max = Math.max(r, Math.max(g, b)), min = Math.min(r, Math.min(g, b));
                  int out = c;
                  if (max - min >= 40) {
                      float[] hsv = new float[3];
                      android.graphics.Color.colorToHSV(c, hsv);
                      if (hsv[0] >= 170f && hsv[0] <= 265f && hsv[1] >= 0.25f) {
                          hsv[0] = 356f;
                          out = android.graphics.Color.HSVToColor((c >>> 24) & 0xff, hsv);
                      }
                  }
                  if (redgramCache.size() < 4096) {
                      redgramCache.put(c, out);
                  }
                  return out;
              }

              public static int getColor(int key, boolean[] isDefault, boolean ignoreAnimation) {
                  return redgramTint(getColorRedgramOrig(key, isDefault, ignoreAnimation));
              }

          '''


          @step("Qizil mavzu (Theme.getColor)")
          def theme():
              p = f"{JAVA_ROOT}/org/telegram/ui/ActionBar/Theme.java"
              t = read(p)
              sig = "public static int getColor(int key, boolean[] isDefault, boolean ignoreAnimation) {"
              if t.count(sig) != 1:
                  raise RuntimeError(f"getColor imzosi {t.count(sig)} marta uchradi, 1 bo'lishi kerak")
              t = t.replace(sig, HOOK + "    private static int getColorRedgramOrig(int key, boolean[] isDefault, boolean ignoreAnimation) {")
              write(p, t)
              return "getColor o'raldi"


          print("\n=== REDgram branding natijalari ===")
          for name, status, msg in RESULTS:
              print(f"[{status}] {name} {('- ' + msg) if msg else ''}")
          sys.exit(0)
          PYEOF

      - name: Save source snapshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-sources
          path: recon/
          if-no-files-found: ignore

      - name: Change package name
        run: |
          NEW_PKG="com.yusufcik.redgram"

          echo "ESKI:"
          grep -rn "APP_PACKAGE" gradle.properties TMessagesProj_App/build.gradle || true

          # 1) APP_PACKAGE qiymatini almashtirish
          sed -i -E "s/^([[:space:]]*APP_PACKAGE[[:space:]]*=[[:space:]]*).*/\1$NEW_PKG/" gradle.properties

          # 2) .beta / .web qo'shimchalarini olib tashlash
          sed -i '/applicationIdSuffix/d' TMessagesProj_App/build.gradle

          echo "YANGI:"
          grep -n "APP_PACKAGE" gradle.properties
          grep -n "applicationIdSuffix" TMessagesProj_App/build.gradle || echo "suffix yo'q"

          grep -qE "APP_PACKAGE[[:space:]]*=[[:space:]]*$NEW_PKG" gradle.properties || { echo "Paket nomi almashmadi"; exit 1; }

          # 3) Firebase fayli bo'lsa
          find . -name "google-services.json" -not -path "*/build/*" -print0 |
          xargs -0 -r sed -i -E "s/\"package_name\": *\"[^\"]+\"/\"package_name\": \"$NEW_PKG\"/"

      - name: Set unique version code
        run: |
          # Play har yuklashda versionCode oshishini talab qiladi
          NEW_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "Eski:"
          grep -n "APP_VERSION_CODE" gradle.properties || echo "APP_VERSION_CODE topilmadi"

          sed -i -E "s/^([[:space:]]*APP_VERSION_CODE[[:space:]]*=[[:space:]]*).*/\1$NEW_CODE/" gradle.properties

          echo "Yangi:"
          grep -n "APP_VERSION_CODE" gradle.properties || echo "OGOHLANTIRISH: versionCode almashmadi"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build AAB
        run: |
          ./gradlew :TMessagesProj_App:bundleAfatRelease \
            --stacktrace \
            --no-daemon

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore GitHub Secrets sozlanmagan."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > redgram-upload.jks

          AAB=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB fayl topilmadi"
            exit 1
          fi

          # Eski (Gradle qo'ygan) imzolarni o'chirish
          zip -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true

          jarsigner \
            -keystore redgram-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

          # Tekshiruv 1: aynan bitta imzo bo'lishi kerak
          SIGS=$(unzip -l "$AAB" | grep -cE 'META-INF/.*\.SF$' || true)
          echo "Imzolar soni: $SIGS"
          [ "$SIGS" = "1" ] || { echo "XATO: imzolar soni 1 emas"; exit 1; }

          # Tekshiruv 2: paket nomi to'g'ri bo'lishi kerak
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq "com.yusufcik.redgram" \
            || { echo "XATO: AAB ichida paket nomi com.yusufcik.redgram emas"; exit 1; }

          mkdir -p output
          cp "$AAB" output/REDgram.aab

          rm -f redgram-upload.jks

      - name: Upload REDgram AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: REDgram-AAB
          path: output/REDgram.aab
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release (zip'siz .aab)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: REDgram build ${{ github.run_number }}
          files: output/REDgram.aab
