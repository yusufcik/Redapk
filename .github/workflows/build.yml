name: Build REDgram AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.* /usr/local/lib/android/sdk/ndk/26.* /usr/local/lib/android/sdk/ndk/27.*
          sudo docker image prune --all --force
          df -h /

      - name: Checkout Telegram source
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          submodules: recursive

      - name: Checkout REDgram files
        uses: actions/checkout@v4
        with:
          repository: yusufcik/Redapk
          ref: main
          path: redgram

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" "platform-tools"
          "$SDKM" "platforms;android-35"
          "$SDKM" "build-tools;35.0.0"
          "$SDKM" "ndk;21.4.7075529"
          "$SDKM" "cmake;3.10.2.4988404"
          "$SDKM" --list_installed

      - name: Set Telegram API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "TG_API_ID yoki TG_API_HASH GitHub Secrets'da yo'q"
            exit 1
          fi

          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          sed -i "s/APP_ID = [0-9]*;/APP_ID = $TG_API_ID;/" "$FILE"
          sed -i "s/APP_HASH = \".*\";/APP_HASH = \"$TG_API_HASH\";/" "$FILE"

          grep -E "APP_ID = $TG_API_ID;" "$FILE" || { echo "APP_ID almashmadi"; exit 1; }
          grep -q "APP_HASH = \"$TG_API_HASH\";" "$FILE" || { echo "APP_HASH almashmadi"; exit 1; }

      - name: Change app name to REDgram
        run: |
          find . -path "*/src/main/res/values/strings.xml" -print0 |
          xargs -0 sed -i 's/>Telegram</>REDgram</g'

          FILE="TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java"
          if [ -f "$FILE" ]; then
            sed -i 's/new SpannableStringBuilder(getString(R.string.AppName))/new SpannableStringBuilder("REDgram")/' "$FILE"
          fi

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build AAB
        run: |
          ./gradlew :TMessagesProj_App:bundleAfatRelease \
            --stacktrace \
            --no-daemon

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore GitHub Secrets sozlanmagan."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > redgram-upload.jks

          AAB=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB fayl topilmadi"
            exit 1
          fi

          jarsigner \
            -keystore redgram-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

          mkdir -p output
          cp "$AAB" output/REDgram.aab

          rm -f redgram-upload.jks

      - name: Upload REDgram AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: REDgram-AAB
          path: output/REDgram.aab
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release (zip'siz .aab)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: REDgram build ${{ github.run_number }}
          files: output/REDgram.aab
