              private static final Map<String, String> seen = new LinkedHashMap<String, String>(256, 0.75f, true) {
                  @Override
                  protected boolean removeEldestEntry(Map.Entry<String, String> eldest) {
                      return size() > 600;
                  }
              };

              private static SharedPreferences prefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("redgram_prefs", Context.MODE_PRIVATE);
              }

              private static void load() {
                  if (loaded) {
                      return;
                  }
                  synchronized (RedConfig.class) {
                      if (loaded) {
                          return;
                      }
                      try {
                          SharedPreferences p = prefs();
                          fBlockApk = p.getBoolean("block_apk", true);
                          fKeepDeleted = p.getBoolean("keep_deleted", true);
                          fKeepEdited = p.getBoolean("keep_edited", true);
                          fGhost = p.getBoolean("ghost", false);
                          loaded = true;
                      } catch (Throwable ignore) {
                      }
                  }
              }

              public static boolean blockApk() {
                  load();
                  return fBlockApk;
              }

              public static boolean keepDeleted() {
                  load();
                  return fKeepDeleted;
              }

              public static boolean keepEdited() {
                  load();
                  return fKeepEdited;
              }

              public static boolean ghost() {
                  load();
                  return fGhost;
              }

              public static void set(String key, boolean value) {
                  load();
                  if ("block_apk".equals(key)) {
                      fBlockApk = value;
                  } else if ("keep_deleted".equals(key)) {
                      fKeepDeleted = value;
                  } else if ("keep_edited".equals(key)) {
                      fKeepEdited = value;
                  } else if ("ghost".equals(key)) {
                      fGhost = value;
                  }
                  try {
                      prefs().edit().putBoolean(key, value).apply();
                  } catch (Throwable ignore) {
                  }
              }

              // ------------------------------------------------------------ APK
              public static boolean isApk(TLRPC.Document d, String name) {
                  try {
                      if (d == null) {
                          return false;
                      }
                      String mime = d.mime_type;
                      if (mime != null && mime.toLowerCase().contains("android.package-archive")) {
                          return true;
                      }
                      if (name != null) {
                          String n = name.toLowerCase();
                          return n.endsWith(".apk") || n.endsWith(".xapk") || n.endsWith(".apks");
                      }
                  } catch (Throwable ignore) {
                  }
                  return false;
              }

              // ------------------------------------------------------------ tahrirlangan xabarlar
              public static void remember(MessageObject m) {
                  try {
                      if (m == null || m.messageOwner == null || !keepEdited()) {
                          return;
                      }
                      TLRPC.Message o = m.messageOwner;
                      String text = o.message;
                      if (text == null || text.isEmpty()) {
                          return;
                      }
                      int i = text.indexOf(MARK);
                      if (i > 0) {
                          text = text.substring(0, i);
                      }
                      synchronized (seen) {
                          seen.put(o.dialog_id + ":" + o.id, text);
                      }
                  } catch (Throwable ignore) {
                  }
              }

              public static void onEdited(TLRPC.Message m) {
                  try {
                      if (m == null || m.message == null || !keepEdited()) {
                          return;
                      }
                      String key = m.dialog_id + ":" + m.id;
                      String fresh = m.message;
                      String old;
                      synchronized (seen) {
                          old = seen.get(key);
                          seen.put(key, fresh);
                      }
                      if (old == null || old.isEmpty() || old.equals(fresh)) {
                          return;
                      }
                      m.message = fresh + MARK + old;
                  } catch (Throwable ignore) {
                  }
              }

