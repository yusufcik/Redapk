                          Browser.openUrl(context, "https://t.me/m27yt");
                      }
                  });
                  LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  blp.topMargin = dp(28);
                  body.addView(btn, blp);

                  dialog.setContentView(root);
                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setBackgroundDrawable(new ColorDrawable(bg));
                      dialog.getWindow().setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  }
                  dialog.show();

                  RedConfig.fetchStats(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              usersView.setText(num(RedConfig.users(), configured));
                              onlineView.setText(num(RedConfig.online(), configured));
                          } catch (Throwable ignore) {
                          }
                      }
                  });
              }
          }
          """

          MC = f"{JAVA_ROOT}/org/telegram/messenger/MessagesController.java"
          CMC = f"{JAVA_ROOT}/org/telegram/ui/Cells/ChatMessageCell.java"
          SA = f"{JAVA_ROOT}/org/telegram/ui/SettingsActivity.java"


          def patch(path, old, new):
              t = read(path)
              n = t.count(old)
              if n != 1:
                  raise RuntimeError(f"{os.path.basename(path)}: {n} ta mos keldi (1 bo'lishi kerak)")
              write(path, t.replace(old, new))


          @step("REDgram sinflari (RedConfig, sozlamalar oynasi)")
          def red_files():
              d = f"{JAVA_ROOT}/org/telegram/messenger"
              server = re.sub(r"[^A-Za-z0-9:/._-]", "", os.environ.get("REDGRAM_SERVER", "")).rstrip("/")
              write(f"{d}/RedConfig.java", RED_CONFIG_JAVA.replace("__REDGRAM_SERVER__", server))
              write(f"{d}/RedSettingsDialog.java", RED_DIALOG_JAVA)
              return "server: " + (server or "ko'rsatilmagan (hisoblagich o'chiq)")


          @step("Sozlamalarda 'REDgram sozlamalari' qatori")
          def red_settings_row():
              old1 = "items.add(SettingCell.Factory.of(1, IconBackgroundColors.BLUE.top"
              new1 = ('items.add(SettingCell.Factory.of(100, IconBackgroundColors.RED.top, IconBackgroundColors.RED.bottom, '
                      'R.drawable.settings_privacy, "REDgram sozlamalari", "Qo\'shimcha imkoniyatlar"));\n        ' + old1)
              patch(SA, old1, new1)
              old2 = "            case 1:\n                presentSettingFragment(new UserInfoActivity());"
              new2 = ("            case 100:\n                org.telegram.messenger.RedSettingsDialog.show(getParentActivity());\n"
                      "                break;\n" + old2)
              patch(SA, old2, new2)
              return "qator va bosish qo'shildi"


          @step("Sharpa rejimi + hisoblagich ping")
          def red_ghost():
              old = ("if (!ignoreSetOnline && getConnectionsManager().getPauseTime() == 0 && "
                     "ApplicationLoader.isScreenOn && !ApplicationLoader.mainInterfacePausedStageQueue) {")
              new = "RedConfig.pingIfNeeded();\n            if (!RedConfig.ghost() && " + old[len("if ("):]
              patch(MC, old, new)
              return "online holati o'raldi"


          @step("O'chirilgan xabarlarni saqlash")
          def red_keep_deleted():
              for cls in ("TL_updateDeleteMessages", "TL_updateDeleteChannelMessages"):
                  old = "} else if (baseUpdate instanceof TL_update." + cls + ") {"
                  new = ("} else if (baseUpdate instanceof TL_update." + cls + " && RedConfig.keepDeleted()) {\n"
                         "                // REDgram: o'chirilgan xabarlar saqlanadi\n            " + old)
                  patch(MC, old, new)
              return "2 ta joy o'zgardi"


          @step("Tahrirlangan xabarlarni saqlash")
          def red_keep_edited():
              old = ("                if (message.out && message.message == null) {\n"
                     "                    message.message = \"\";\n"
                     "                    message.attachPath = \"\";\n"
                     "                }\n\n"
                     "                ImageLoader.saveMessageThumbs(message);")
              new = old.replace("                ImageLoader.saveMessageThumbs(message);",
                                "                RedConfig.onEdited(message);\n                ImageLoader.saveMessageThumbs(message);")
              patch(MC, old, new)
              old2 = "boolean lastInChatList) {\n        if (attachedToWindow && !frozen) {"
              new2 = "boolean lastInChatList) {\n        org.telegram.messenger.RedConfig.remember(messageObject);\n        if (attachedToWindow && !frozen) {"
              patch(CMC, old2, new2)
              return "2 ta joy o'zgardi"


          @step("APK bloklash")
          def red_block_apk():
              old = "String name = FileLoader.getDocumentFileName(documentAttach);"
              new = ("String name = (org.telegram.messenger.RedConfig.blockApk() && org.telegram.messenger.RedConfig.isApk("
                     "documentAttach, FileLoader.getDocumentFileName(documentAttach))) ? \"APK BLOKLANDI\" : "
                     "FileLoader.getDocumentFileName(documentAttach);")
              patch(CMC, old, new)
              old2 = "    void didPressButton(boolean animated, boolean video) {\n"
              new2 = (old2 + "        if (org.telegram.messenger.RedConfig.blockApk() && documentAttach != null && "
                      "org.telegram.messenger.RedConfig.isApk(documentAttach, FileLoader.getDocumentFileName(documentAttach))) {\n"
                      "            return;\n        }\n")
              patch(CMC, old2, new2)
              return "nom va bosish bloklandi"



          @step("Kirish ekrani rasmi (ic_launcher_dr)")
          def splash_drawable():
              from PIL import Image
              files = glob.glob("**/res/drawable-*dpi/ic_launcher_dr.*", recursive=True)
              if not files:
                  raise RuntimeError("ic_launcher_dr topilmadi")
              img = Image.open(f"{RES_ROOT}/drawable-nodpi/redgram_splash.png").convert("RGBA")
              n = 0
              for p in files:
                  try:
                      size = Image.open(p).size
                  except Exception:  # noqa: BLE001
                      continue
                  im = img.resize(size, Image.LANCZOS)
                  if p.lower().endswith(".webp"):
                      im.save(p, "WEBP", lossless=True)
                  else:
                      im.save(p, "PNG")
                  n += 1
              return f"{n} ta fayl almashtirildi"


          @step("Xatolik jurnali (ApplicationLoader)")
          def red_crashlog():
              if os.environ.get("REDGRAM_CRASHLOG", "1") == "0":
                  return "o'chirilgan (REDGRAM_CRASHLOG=0)"
              p = f"{JAVA_ROOT}/org/telegram/messenger/ApplicationLoader.java"
              t = read(p)
              m = re.search(r"public\s+void\s+onCreate\s*\(\s*\)\s*\{\s*super\.onCreate\(\)\s*;", t)
              if not m:
                  raise RuntimeError("Application.onCreate topilmadi")
              write(p, t[:m.end()] + "\n        RedConfig.installCrashLog(this);" + t[m.end():])
              return "yoqildi"


          print("\n=== REDgram branding natijalari ===")
          for name, status, msg in RESULTS:
              print(f"[{status}] {name} {('- ' + msg) if msg else ''}")
          sys.exit(0)
          PYEOF

      - name: Save source snapshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-sources
          path: recon/
          if-no-files-found: ignore

      - name: Change package name
        run: |
          NEW_PKG="com.yusufcik.redgram"

          echo "ESKI:"
          grep -rn "APP_PACKAGE" gradle.properties TMessagesProj_App/build.gradle || true

          # 1) APP_PACKAGE qiymatini almashtirish
          sed -i -E "s/^([[:space:]]*APP_PACKAGE[[:space:]]*=[[:space:]]*).*/\1$NEW_PKG/" gradle.properties

          # 2) .beta / .web qo'shimchalarini olib tashlash
          sed -i '/applicationIdSuffix/d' TMessagesProj_App/build.gradle

          echo "YANGI:"
          grep -n "APP_PACKAGE" gradle.properties
          grep -n "applicationIdSuffix" TMessagesProj_App/build.gradle || echo "suffix yo'q"

          grep -qE "APP_PACKAGE[[:space:]]*=[[:space:]]*$NEW_PKG" gradle.properties || { echo "Paket nomi almashmadi"; exit 1; }

          # 3) Firebase fayli bo'lsa
          find . -name "google-services.json" -not -path "*/build/*" -print0 |
          xargs -0 -r sed -i -E "s/\"package_name\": *\"[^\"]+\"/\"package_name\": \"$NEW_PKG\"/"

      - name: Set unique version code
        run: |
          # Play har yuklashda versionCode oshishini talab qiladi
          NEW_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "Eski:"
          grep -n "APP_VERSION_CODE" gradle.properties || echo "APP_VERSION_CODE topilmadi"

          sed -i -E "s/^([[:space:]]*APP_VERSION_CODE[[:space:]]*=[[:space:]]*).*/\1$NEW_CODE/" gradle.properties

          echo "Yangi:"
          grep -n "APP_VERSION_CODE" gradle.properties || echo "OGOHLANTIRISH: versionCode almashmadi"

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build AAB
        run: |
          ./gradlew :TMessagesProj_App:bundleAfatRelease \
            --stacktrace \
            --no-daemon

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore GitHub Secrets sozlanmagan."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > redgram-upload.jks

          AAB=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB fayl topilmadi"
            exit 1
          fi

          # Eski (Gradle qo'ygan) imzolarni o'chirish
          zip -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true

          jarsigner \
            -keystore redgram-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

          # Tekshiruv 1: aynan bitta imzo bo'lishi kerak
          SIGS=$(unzip -l "$AAB" | grep -cE 'META-INF/.*\.SF$' || true)
          echo "Imzolar soni: $SIGS"
          [ "$SIGS" = "1" ] || { echo "XATO: imzolar soni 1 emas"; exit 1; }

          # Tekshiruv 2: paket nomi to'g'ri bo'lishi kerak
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq "com.yusufcik.redgram" \
            || { echo "XATO: AAB ichida paket nomi com.yusufcik.redgram emas"; exit 1; }

          mkdir -p output
          cp "$AAB" output/REDgram.aab

          rm -f redgram-upload.jks

      - name: Upload REDgram AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: REDgram-AAB
          path: output/REDgram.aab
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release (zip'siz .aab)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: REDgram build ${{ github.run_number }}
          files: output/REDgram.aab
